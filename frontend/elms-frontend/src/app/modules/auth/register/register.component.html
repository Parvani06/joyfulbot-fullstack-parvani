<div class="login-container">
  <div class="login-card">
    <h2>ELMS Register</h2>
    <p class="subtitle">Enterprise Leave Management System</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Name</label>
        <input type="text" formControlName="name" placeholder="Enter your name" />
        <span class="error" *ngIf="registerForm.get('name').invalid && registerForm.get('name').touched">
          Name is required
        </span>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email" />
        <span class="error" *ngIf="registerForm.get('email').invalid && registerForm.get('email').touched">
          Valid email is required
        </span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Minimum 6 characters" />
        <span class="error" *ngIf="registerForm.get('password').invalid && registerForm.get('password').touched">
          Password must be at least 6 characters
        </span>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Confirm your password" />
        <span class="error" *ngIf="registerForm.get('confirmPassword').invalid && registerForm.get('confirmPassword').touched">
          Passwords must match
        </span>
      </div>

      <div class="form-group">
        <label>Department</label>
        <select formControlName="departmentId">
          <option value="">Select a department</option>
          <option *ngFor="let dept of departments" [value]="dept.id">
            {{ dept.name }}
          </option>
        </select>
        <span class="error" *ngIf="registerForm.get('departmentId').invalid && registerForm.get('departmentId').touched">
          Department is required
        </span>
      </div>

      <div class="form-group">
        <label>Role</label>
        <select formControlName="role">
          <option value="EMPLOYEE">Employee</option>
          <option value="MANAGER">Manager</option>
        </select>
        <span class="error" *ngIf="registerForm.get('role').invalid && registerForm.get('role').touched">
          Role is required
        </span>
      </div>

      <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>

      <p class="login-link">Already have an account? <a routerLink="/login">Login here</a></p>
    </form>
  </div>
</div>
