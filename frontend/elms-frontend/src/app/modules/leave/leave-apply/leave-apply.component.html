<div class="page-container">
  <app-navbar></app-navbar>

  <div class="page-header">
    <h2>Apply for Leave</h2>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <div class="success-msg" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

      <form [formGroup]="applyForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Leave Type</mat-label>
          <mat-select formControlName="leaveTypeId">
            <mat-option value="">Select leave type</mat-option>
            <mat-option *ngFor="let type of leaveTypes" [value]="type.id">
              {{ type.name }} ({{ type.maxDaysPerYear }} days/year)
            </mat-option>
          </mat-select>
          <mat-error *ngIf="applyForm.get('leaveTypeId').invalid && applyForm.get('leaveTypeId').touched">
            Please select a leave type
          </mat-error>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Start Date</mat-label>
            <input matInput type="date" formControlName="startDate" />
            <mat-error *ngIf="applyForm.get('startDate').invalid && applyForm.get('startDate').touched">
              Start date is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>End Date</mat-label>
            <input matInput type="date" formControlName="endDate" />
            <mat-error *ngIf="applyForm.get('endDate').invalid && applyForm.get('endDate').touched">
              End date is required
            </mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Total Days</mat-label>
          <input matInput formControlName="totalDays" readonly />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Reason</mat-label>
          <textarea matInput formControlName="reason" rows="4" placeholder="Enter reason for leave"></textarea>
          <mat-error *ngIf="applyForm.get('reason').invalid && applyForm.get('reason').touched">
            Reason is required
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loading" class="full-width-button">
          {{ loading ? 'Submitting...' : 'Submit Application' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
