<mat-toolbar color="primary" class="navbar">
  <div class="toolbar-left">
    <button mat-button class="brand" routerLink="/dashboard">
      <mat-icon>business</mat-icon>
      ELMS
    </button>
    <span class="spacer"></span>
    <button mat-button routerLink="/dashboard">Dashboard</button>
    <button mat-button routerLink="/leaves" *ngIf="!isManager()">My Leaves</button>
    <button mat-button routerLink="/leaves/apply" *ngIf="!isManager()">Apply Leave</button>
    <button mat-button routerLink="/manager/team-leaves" *ngIf="isManager()">Team Leaves</button>
  </div>
  <div class="toolbar-right" *ngIf="userName">
    <button mat-button [matMenuTriggerFor]="profileMenu">
      <mat-icon>account_circle</mat-icon>
      <span>{{ userName }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #profileMenu="matMenu">
      <div mat-menu-item disabled style="opacity:1;">
        <span class="role-badge">{{ userRole }}</span>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        Logout
      </button>
    </mat-menu>
  </div>
</mat-toolbar>
